<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OMEGA-ARC Browser Hands — pairing</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; background: #0a1118; color: #cfe9f5; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 18px; letter-spacing: 0.08em; color: #62e4ff; }
    label { display: block; margin-top: 14px; font-size: 12px; letter-spacing: 0.1em; color: #9bc; }
    input { width: 100%; box-sizing: border-box; padding: 8px; background: #0f1a24; color: #cfe9f5; border: 1px solid #3b5566; border-radius: 4px; font-family: monospace; }
    button { margin-top: 16px; padding: 8px 14px; background: #123; color: #7ef0a8; border: 1px solid #7ef0a8; border-radius: 4px; cursor: pointer; letter-spacing: 0.08em; }
    #status { margin-top: 14px; font-size: 13px; color: #f3be58; white-space: pre-wrap; }
    p.hint { font-size: 12px; color: #8aa; }
  </style>
</head>
<body>
  <h1>OMEGA-ARC BROWSER HANDS</h1>
  <p class="hint">Pair this browser with the OMEGA-ARC runtime on this PC. The pairing token is on the desktop console under THE BROWSER HANDS. Nothing in this browser is reachable until the console's switch is ON, and clicking or typing waits for your fingerprint.</p>
  <label for="backend">BACKEND URL</label>
  <input id="backend" placeholder="http://127.0.0.1:8001">
  <label for="token">PAIRING TOKEN</label>
  <input id="token" placeholder="paste from the console">
  <button id="save">SAVE &amp; TEST</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
